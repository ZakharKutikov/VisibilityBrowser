    <section class="weather-card" id="weather-card">
      <button class="weather-main" id="weather-now" type="button">
        <span class="weather-icon" id="weather-icon" aria-hidden="true">🌤️</span>
        <span class="weather-info">
          <span class="weather-temp" id="weather-temp">--°C</span>
          <span class="weather-desc" id="weather-text" data-i18n="weatherSet"></span>
        </span>
      </button>
      <form class="city" id="city-form" hidden>
        <input id="city-input" type="text" autocomplete="off" maxlength="60"
               data-i18n-placeholder="cityPlaceholder" data-i18n-aria="cityLabel">
        <div class="city-actions">
          <button class="btn-primary" type="submit" data-i18n="citySave"></button>
          <button class="btn-text" type="button" id="city-remove" data-i18n="cityRemove"></button>
        </div>
      </form>
      <p class="weather-error" id="weather-error" role="status" hidden></p>
    </section>

    <section class="recent-section" id="recent-section" hidden>
      <h2 class="recent-title" data-i18n="recentTitle"></h2>
      <ul class="recent" id="recent"></ul>
    </section>

    <footer class="footer" id="footer"></footer>
