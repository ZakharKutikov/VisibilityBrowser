<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visibility Browser</title>
  <script src="lang-manager.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #121212;
      --bg-secondary: #1e1e20;
      --bg-tertiary: #2a2a2d;
      --bg-hover: rgba(255, 255, 255, 0.08);
      --text-primary: #f0f0f0;
      --text-secondary: #aaaaaa;
      --text-muted: #777777;
      --accent: #5e81ac;
      --accent-dim: rgba(94, 129, 172, 0.15);
      --danger: #bf616a;
      --border: #333333;
      --border-bright: #444444;
      --radius-sm: 4px;
      --radius-md: 8px;
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    .sidebar-header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .sidebar-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sidebar-tabs {
      display: flex;
      gap: 4px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .sidebar-tab-btn {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.15s, color 0.15s;
    }
    .sidebar-tab-btn.active { background: var(--accent-dim); color: var(--accent); }
    .sidebar-tab-btn:hover:not(.active) { background: var(--bg-hover); color: var(--text-primary); }

    .sidebar-panel { display: none; flex: 1; flex-direction: column; overflow: hidden; }
    .sidebar-panel.active { display: flex; }

    .sidebar-search {
      margin: 10px 12px;
      padding: 10px 14px;
      background: var(--bg-tertiary);
      border: 1.5px solid var(--border-bright);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
      font-family: 'Inter', sans-serif;
      flex-shrink: 0;
    }
    .sidebar-search:focus { border-color: var(--accent); }
    .sidebar-search::placeholder { color: var(--text-muted); }

    .sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 8px;
    }
    .sidebar-list::-webkit-scrollbar { width: 6px; }
    .sidebar-list::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 3px; }

    .history-item, .bm-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      cursor: pointer;
      transition: background 0.15s;
    }
    .history-item:hover, .bm-item:hover { background: var(--bg-hover); }
    .hi-icon, .bm-icon { font-size: 14px; flex-shrink: 0; }
    .hi-content, .bm-content { flex: 1; min-width: 0; }
    .hi-title, .bm-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }
    .hi-url, .bm-url {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hi-time { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    
    .hi-delete, .bm-remove {
      width: 28px; height: 28px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      opacity: 0;
      transition: background 0.15s, opacity 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    .history-item:hover .hi-delete, .bm-item:hover .bm-remove { opacity: 1; }
    .hi-delete:hover, .bm-remove:hover { background: rgba(224,85,85,0.2); color: var(--danger); }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      color: var(--text-muted);
      gap: 12px;
      text-align: center;
    }
    .empty-state-icon { font-size: 56px; opacity: 0.3; }
    .empty-state-text { font-size: 15px; }

    .sidebar-footer {
      padding: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .sidebar-action-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.15s, transform 0.1s;
    }
    .sidebar-action-btn:active { transform: scale(0.97); }
    .btn-danger { background: rgba(224,85,85,0.15); color: var(--danger); }
    .btn-danger:hover { background: rgba(224,85,85,0.25); }
    
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 4px; }
  </style>
</head>
<body>
  <div class="sidebar-header">
    <div class="sidebar-title" id="browser-title"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:8px;"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>Браузер</div>
  </div>
  <div class="sidebar-tabs">
    <button class="sidebar-tab-btn active" data-panel="history" id="tab-history"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px;"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>История</button>
    <button class="sidebar-tab-btn" data-panel="bookmarks" id="tab-bookmarks"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px;"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>Закладки</button>
  </div>

  <!-- History Panel -->
  <div class="sidebar-panel active" id="panel-history">
    <input type="text" class="sidebar-search" id="history-search" placeholder="Поиск в истории...">
    <div class="sidebar-list" id="history-list"></div>
    <div class="sidebar-footer">
      <button class="sidebar-action-btn btn-danger" id="btn-clear-history"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px;"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>Очистить всё</button>
    </div>
  </div>

  <!-- Bookmarks Panel -->
  <div class="sidebar-panel" id="panel-bookmarks">
    <div class="sidebar-list" id="bookmarks-list"></div>
  </div>

  <script src="history-renderer.js"></script>
</body>
</html>
